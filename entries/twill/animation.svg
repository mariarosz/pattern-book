  <title id="t">Twill</title>
  <desc id="d">A two-over, two-under twill cloth strengthens float by float in a diagonal sweep, showing the slanted ribs of the weave, then fades back to a faint trace in the same direction.</desc>
  <style>
    svg { --linen: #a8967b; --peach: #e39b82; --rose: #e2b4bb; --blue: #8fa5cf; }
    g {
      transform-box: fill-box;
      transform-origin: center;
      animation: float 6s cubic-bezier(.4, 0, .2, 1) calc(var(--d) * .09s) infinite backwards;
    }
    @keyframes float {
      0%, 76%, 100% { opacity: .16; transform: scale(.8); }
      14%, 62% { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { g { animation: none; } }
  </style>
