<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Warp field</title>
  <desc id="d">A field of fine, gently curved vertical threads in linen with a few coloured ones sways slowly from side to side, each thread slightly out of step with its neighbours.</desc>
  <style>
    svg { --linen: #a8967b; --peach: #e39b82; --rose: #e2b4bb; --blue: #8fa5cf; --wax: #d9a938; }
    path {
      fill: none;
      stroke: var(--linen);
      stroke-width: 1.5;
      stroke-linecap: round;
      transform-origin: 200px -20px;
      animation: sway 6s ease-in-out calc(var(--k) * -.37s) infinite;
    }
    .p { stroke: var(--peach); stroke-width: 2.2; }
    .r { stroke: var(--rose); stroke-width: 2.2; }
    .b { stroke: var(--blue); stroke-width: 2.2; }
    .w { stroke: var(--wax); stroke-width: 2.2; }
    @keyframes sway {
      0%, 100% { transform: translateX(-7px) skewX(-1.5deg); }
      50% { transform: translateX(7px) skewX(1.5deg); }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none; } }
  </style>
