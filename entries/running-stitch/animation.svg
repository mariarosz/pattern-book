<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Running stitch</title>
  <desc id="d">Two rings of small stitches are sewn around a circle in opposite directions, then unpicked, while both rings make one full turn, as a loading indicator.</desc>
  <style>
    svg { --linen: #a8967b; --peach: #e39b82; }
    circle { fill: none; stroke-linecap: round; }
    .stitch { stroke: var(--peach); stroke-width: 2.5; stroke-dasharray: 15 11.48; }
    .inner { stroke: var(--linen); stroke-width: 1.8; stroke-dasharray: 7 9; }
    .pull { stroke: #fff; stroke-width: 12; stroke-dasharray: 1; animation: sew 3s cubic-bezier(.6, 0, .3, 1) infinite; }
    g { transform-origin: 200px 200px; animation: turn 3s cubic-bezier(.6, 0, .3, 1) infinite; }
    @keyframes sew {
      0% { stroke-dashoffset: .93; }
      45%, 55% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -.93; }
    }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .pull, g { animation: none; } }
  </style>
  <defs>
    <mask id="a"><circle class="pull" pathLength="1" cx="200" cy="200" r="118" transform="rotate(-90 200 200)"/></mask>
    <mask id="b"><circle class="pull" pathLength="1" cx="200" cy="200" r="84" transform="matrix(0 -1 -1 0 400 400)"/></mask>
  </defs>
  <g>
    <circle class="stitch" mask="url(#a)" cx="200" cy="200" r="118"/>
    <circle class="stitch inner" mask="url(#b)" cx="200" cy="200" r="84"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
