<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Button</title>
  <desc id="d">A four-hole button is sewn on: two peach stitches cross between the holes one after the other, the button dips slightly at each pull, then the thread is removed.</desc>
  <style>
    svg { --linen: #a8967b; --peach: #e39b82; }
    circle { fill: none; stroke: var(--linen); stroke-width: 2; }
    .rim { stroke-width: 1.5; stroke-opacity: .6; }
    .thread { fill: none; stroke: var(--peach); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1; }
    .one { animation: one 4s cubic-bezier(.6, 0, .3, 1) infinite; }
    .two { animation: two 4s cubic-bezier(.6, 0, .3, 1) infinite; }
    .button { transform-origin: 200px 200px; animation: press 4s cubic-bezier(.4, 0, .2, 1) infinite; }
    @keyframes one {
      0%, 8% { stroke-dashoffset: 1; }
      24%, 70% { stroke-dashoffset: 0; }
      81%, 100% { stroke-dashoffset: -1; }
    }
    @keyframes two {
      0%, 28% { stroke-dashoffset: 1; }
      44%, 82% { stroke-dashoffset: 0; }
      93%, 100% { stroke-dashoffset: -1; }
    }
    @keyframes press {
      0%, 16%, 30%, 36%, 50%, 100% { transform: none; }
      23%, 43% { transform: scale(.95); }
    }
    @media (prefers-reduced-motion: reduce) { .one, .two, .button { animation: none; } }
  </style>
  <g class="button">
    <circle cx="200" cy="200" r="112"/>
    <circle class="rim" cx="200" cy="200" r="88"/>
    <circle cx="170" cy="170" r="9"/><circle cx="230" cy="170" r="9"/><circle cx="170" cy="230" r="9"/><circle cx="230" cy="230" r="9"/>
    <path class="thread one" pathLength="1" d="M170 170L230 230"/>
    <path class="thread two" pathLength="1" d="M230 170L170 230"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
