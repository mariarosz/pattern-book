<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Dye</title>
  <desc id="d">Three soft blots of blue, rose and yellow dye spread across the square and overlap, revealing the fine check of the cloth underneath, then draw back to three small spots.</desc>
  <style>
    svg { --linen: #a8967b; --rose: #e2b4bb; --blue: #8fa5cf; --wax: #d9a938; }
    .blot {
      mix-blend-mode: multiply;
      transform-box: fill-box;
      transform-origin: center;
      animation: spread 6s cubic-bezier(.45, 0, .25, 1) calc(var(--i) * .5s) infinite backwards;
    }
    @keyframes spread {
      0%, 100% { transform: scale(.14); }
      40%, 72% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { .blot { animation: none; } }
  </style>
