<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Gauze</title>
  <desc id="d">Twelve fine coloured weft threads slip one by one through twelve linen warp threads, over one and under one, rest as a loose cloth, then slip out again.</desc>
  <style>
    svg { --linen: #a8967b; --peach: #e39b82; --rose: #e2b4bb; --blue: #8fa5cf; --wax: #d9a938; }
    path { fill: none; stroke: var(--linen); stroke-width: 1.7; stroke-linecap: round; }
    .cloth { transform-origin: 200px 200px; animation: breathe 6s ease-in-out infinite; }
    .weft path {
      stroke: var(--peach);
      transform-box: fill-box;
      transform-origin: left center;
      animation: pick 6s cubic-bezier(.6, 0, .25, 1) calc(var(--k) * .2s) infinite backwards;
    }
    .weft .e { transform-origin: right center; }
    .weft .r { stroke: var(--rose); stroke-width: 2.2; }
    .weft .b { stroke: var(--blue); }
    .weft .w { stroke: var(--wax); }
    @keyframes pick {
      0% { transform: scaleX(0); opacity: 0; }
      4% { opacity: 1; }
      16%, 68% { transform: scaleX(1); opacity: 1; }
      84% { transform: scaleX(0); opacity: 1; }
      86%, 100% { transform: scaleX(0); opacity: 0; }
    }
    @keyframes breathe {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.5deg); }
    }
    @media (prefers-reduced-motion: reduce) { .cloth, .weft path { animation: none; } }
  </style>
