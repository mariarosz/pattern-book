<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Loose thread</title>
  <desc id="d">A single peach thread runs across the square in five loops that swell and settle, then is drawn out again from the end where it began.</desc>
  <style>
    svg { --peach: #e39b82; }
    path {
      fill: none;
      stroke: var(--peach);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      animation: draw 6s cubic-bezier(.6, 0, .3, 1) infinite;
    }
    @keyframes draw {
      0% { stroke-dashoffset: .955; }
      45%, 62% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -.955; }
    }
    @media (prefers-reduced-motion: reduce) { path { animation: none; } }
  </style>
