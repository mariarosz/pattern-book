<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Patchwork</title>
  <desc id="d">Five scraps of cloth, plain, striped, dotted and checked, drift together into a collage and are joined by a line of running stitches.</desc>
  <style>
    svg { --linen: #a8967b; --peach: #e39b82; --rose: #e2b4bb; --blue: #8fa5cf; --wax: #d9a938; }
    .scrap {
      mix-blend-mode: multiply;
      transform-box: fill-box;
      transform-origin: center;
      animation: settle 6s cubic-bezier(.3, .7, .2, 1) calc(var(--i) * .22s) infinite backwards;
    }
    .stitch { mix-blend-mode: multiply; fill: none; stroke: var(--linen); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 7 6; }
    .pull { fill: none; stroke: #fff; stroke-width: 8; stroke-dasharray: 1; animation: sew 6s cubic-bezier(.5, 0, .3, 1) infinite; }
    @keyframes settle {
      0%, 88%, 100% { opacity: .22; transform: translate(var(--x), var(--y)) rotate(var(--r)); }
      24%, 74% { opacity: 1; transform: none; }
    }
    @keyframes sew {
      0%, 40% { stroke-dashoffset: 1; }
      60%, 66% { stroke-dashoffset: 0; }
      76%, 100% { stroke-dashoffset: -1; }
    }
    @media (prefers-reduced-motion: reduce) { .scrap, .pull { animation: none; } }
  </style>
  <defs>
    <pattern id="stripe" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(8)"><rect width="9" height="9" fill="var(--blue)" fill-opacity=".22"/><path d="M0 2.5h9" stroke="var(--blue)" stroke-width="1.3"/></pattern>
    <pattern id="dot" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)"><rect width="14" height="14" fill="var(--rose)" fill-opacity=".5"/><circle cx="4" cy="4" r="1.9" fill="var(--peach)"/><circle cx="11" cy="11" r="1.9" fill="var(--peach)"/></pattern>
    <pattern id="check" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(4)"><rect width="16" height="16" fill="var(--linen)" fill-opacity=".2"/><path d="M0 4h16M4 0v16" stroke="var(--linen)" stroke-width="1.2"/></pattern>
    <mask id="thread"><path class="pull" pathLength="1" d="M96 150C150 118 186 206 244 150S318 214 286 262S214 300 150 262"/></mask>
  </defs>
  <path class="scrap" style="--i:0;--x:-46px;--y:-30px;--r:-9deg" fill="var(--peach)" fill-opacity=".8" d="M92 98L212 84L228 194L152 216L84 186Z"/>
  <path class="scrap" style="--i:1;--x:44px;--y:-38px;--r:7deg" fill="url(#stripe)" d="M198 72L318 98L304 192L210 176Z"/>
  <path class="scrap" style="--i:2;--x:-50px;--y:34px;--r:8deg" fill="url(#dot)" d="M72 202L178 186L198 298L98 322Z"/>
  <path class="scrap" style="--i:3;--x:48px;--y:30px;--r:-6deg" fill="url(#check)" d="M182 182L322 170L330 288L206 316Z"/>
  <path class="scrap" style="--i:4;--x:20px;--y:56px;--r:12deg" fill="var(--wax)" fill-opacity=".85" d="M238 252L298 240L312 318L248 330Z"/>
  <path class="stitch" mask="url(#thread)" d="M96 150C150 118 186 206 244 150S318 214 286 262S214 300 150 262"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
